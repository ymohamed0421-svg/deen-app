# Builds the web version of the app and puts it online for free with GitHub Pages.
# It runs on every push to main. The link is https://<github-user>.github.io/deen-app/
name: Publish web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the Quran audio API allows this site (for the logs)
        continue-on-error: true
        run: curl -sS -D - -o /dev/null -H "Origin: https://ymohamed0421-svg.github.io" "https://api.qurancdn.com/api/qdc/audio/reciters/97/audio_files?chapter=1&segments=true" | grep -i -E "^(HTTP|access-control)" || true
      - name: Serve from /deen-app/
        run: node -e "const f='app.json',j=require('./'+f);j.expo.experiments={...j.expo.experiments,baseUrl:'/deen-app'};require('fs').writeFileSync(f,JSON.stringify(j,null,2))"
      - name: Build
        # Uses the public Supabase settings in .env
        run: npx expo export --platform web --output-dir dist
      - run: node scripts/web-finish.mjs dist /deen-app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
